<div style="background:#131210;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#f4f1ea">
  <div style="max-width:440px;margin:0 auto;background:#1e1c19;border-radius:24px;padding:28px 24px">
    <p style="margin:0 0 20px;font-size:26px;font-weight:800;color:#c8f03c">Unloop</p>
    <p style="margin:0 0 24px;font-size:17px;line-height:1.4">Forgot your password? Happens. Tap below to set a new one.</p>
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/new-password" style="display:inline-block;background:#c8f03c;color:#131210;font-size:16px;font-weight:700;text-decoration:none;padding:14px 22px;border-radius:16px">Set a new password</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#a8a296">Didn't ask for this? Ignore this email and your password stays the same.</p>
  </div>
</div>
